{% extends "admin/base_admin.html" %}
{% block title %}{{ "Modifier" if fournisseur else "Nouveau" }} fournisseur{% endblock %}
{% block content %}
<h2 class="mb-4">{{ "Modifier" if fournisseur else "Nouveau" }} fournisseur</h2>
<form method="POST" style="max-width:600px;">
  <div class="mb-3">
    <label class="form-label">Nom *</label>
    <input type="text" name="nom" class="form-control" value="{{ fournisseur.nom if fournisseur else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Personne de contact</label>
    <input type="text" name="contact" class="form-control" value="{{ fournisseur.contact if fournisseur else '' }}">
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Téléphone</label>
      <input type="text" name="telephone" class="form-control" value="{{ fournisseur.telephone if fournisseur else '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" value="{{ fournisseur.email if fournisseur else '' }}">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Adresse</label>
    <input type="text" name="adresse" class="form-control" value="{{ fournisseur.adresse if fournisseur else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Notes</label>
    <textarea name="notes" class="form-control" rows="3">{{ fournisseur.notes if fournisseur else '' }}</textarea>
  </div>
  <div class="form-check mb-3">
    <input type="checkbox" name="actif" class="form-check-input" id="actif" {% if not fournisseur or fournisseur.actif %}checked{% endif %}>
    <label class="form-check-label" for="actif">Fournisseur actif</label>
  </div>
  <button type="submit" class="btn btn-primary">Enregistrer</button>
  <a href="{{ url_for('admin.suppliers_list') }}" class="btn btn-outline-secondary">Annuler</a>
</form>
{% endblock %}
