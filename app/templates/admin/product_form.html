{% extends "admin/base_admin.html" %}
{% block title %}{{ "Modifier" if produit else "Nouveau" }} produit{% endblock %}
{% block content %}
<h2 class="mb-4">{{ "Modifier" if produit else "Nouveau" }} produit</h2>
<form method="POST" enctype="multipart/form-data" style="max-width:600px;">
  <div class="mb-3">
    <label class="form-label">Nom *</label>
    <input type="text" name="nom" class="form-control" value="{{ produit.nom if produit else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="3">{{ produit.description if produit else '' }}</textarea>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Prix (FCFA, optionnel)</label>
      <input type="number" step="0.01" name="prix" class="form-control" value="{{ produit.prix if produit and produit.prix else '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Unité</label>
      <input type="text" name="unite" class="form-control" value="{{ produit.unite if produit else 'unité' }}">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Stock</label>
    <input type="number" name="stock" class="form-control" value="{{ produit.stock if produit else 0 }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Activité *</label>
    <select name="activite_id" class="form-select" required>
      {% for a in activites %}
      <option value="{{ a.id }}" {% if produit and produit.activite_id == a.id %}selected{% endif %}>{{ a.nom }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Fournisseur</label>
    <select name="fournisseur_id" class="form-select">
      <option value="">— Aucun —</option>
      {% for f in fournisseurs %}
      <option value="{{ f.id }}" {% if produit and produit.fournisseur_id == f.id %}selected{% endif %}>{{ f.nom }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Image</label>
    <input type="file" name="image" class="form-control">
  </div>
  <div class="form-check mb-3">
    <input type="checkbox" name="disponible" class="form-check-input" id="disponible" {% if not produit or produit.disponible %}checked{% endif %}>
    <label class="form-check-label" for="disponible">Disponible à la vente</label>
  </div>
  <button type="submit" class="btn btn-primary">Enregistrer</button>
  <a href="{{ url_for('admin.products_list') }}" class="btn btn-outline-secondary">Annuler</a>
</form>
{% endblock %}
